services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/data
      - whisper-models:/models
    env_file: [.env]
    environment:
      CUTCLIPS_STORAGE: /data
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "api.worker"]
    volumes:
      - ./storage:/data
      - whisper-models:/models
    env_file: [.env]
    environment:
      CUTCLIPS_STORAGE: /data
    restart: unless-stopped
    # Escalar = mais workers: docker compose up -d --scale worker=3
    # Com GPU NVIDIA, descomente:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  whisper-models:
