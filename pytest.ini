[pytest]
testpaths = tests
# `importlib` impede o pytest de inserir a raiz do projeto em sys.path ao coletar
# os testes — que era o outro caminho por onde `select.py` sombreava a stdlib.
addopts = --import-mode=importlib
python_files = test_api.py test_engine.py test_topfive.py test_montages.py test_trending.py test_narration.py
# O diretório do projeto NÃO entra em sys.path: `select.py` sombrearia o módulo
# `select` da biblioteca padrão e o pytest quebraria antes de coletar. Os testes
# importam `cutclips.x`, então quem entra é o diretório pai.
pythonpath = ..
